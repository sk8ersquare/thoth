name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 (all backends: Whisper Metal + Parakeet + FluidAudio Neural Engine)
          # macos-15 required for Swift 6.0+ (FluidAudio dependency)
          # DMG bundling skipped in CI (requires create-dmg + Apple signing cert).
          # The .app.tar.gz updater artifact is built via --bundles app,updater.
          # DMG is produced locally via scripts/release.sh for distribution.
          - platform: macos-15
            args: '--target aarch64-apple-darwin --bundles app,updater'
            rustflags: ''
          # Linux x86_64 (Whisper only; Parakeet excluded — upstream sherpa-onnx
          # Linux static archive lacks .a libs; FluidAudio is macOS-only)
          - platform: ubuntu-22.04
            args: '-- --no-default-features'
            rustflags: ''
          # Windows x86_64 — Whisper CPU only for now.
          # Parakeet (Sherpa-ONNX) requires additional Win32 linker flags (advapi32)
          # that can't be injected into the sherpa-rs DLL link step via config.toml.
          # Will re-enable once we find a solution (patch sherpa-rs-sys or use a wrapper).
          # FluidAudio is macOS-only.
          - platform: windows-latest
            args: '-- --no-default-features'
            rustflags: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS ARM64 target
        if: matrix.platform == 'macos-15'
        run: rustup target add aarch64-apple-darwin

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install system dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Patch version for Windows (MSI requires each component <= 255)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          # Strip century: 2026.2.11 -> 26.2.11
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          WIN_VERSION=$(echo "$VERSION" | sed 's/^20//')
          echo "Patching version $VERSION -> $WIN_VERSION for Windows"
          sed -i "s/version = \"$VERSION\"/version = \"$WIN_VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \"$VERSION\"/\"version\": \"$WIN_VERSION\"/" package.json

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CFLAGS: ${{ matrix.platform == 'macos-15' && '-march=armv8-a' || '' }}
          CXXFLAGS: ${{ matrix.platform == 'macos-15' && '-march=armv8-a' || '' }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        with:
          tagName: v__VERSION__
          releaseName: 'Thoth v__VERSION__'
          releaseBody: 'See the assets below to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Attach the permission-reset helper to every release
      - name: Upload fix-permissions.sh
        if: matrix.platform == 'macos-15'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          gh release upload "v${VERSION}" scripts/fix-permissions.sh --clobber
